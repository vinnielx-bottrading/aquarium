<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra sprite Aquarium</title><link rel="stylesheet" href="game.css"><main style="padding:30px"><h1>Bơi và quay đầu · Hai loài cá</h1><p><a href="index.html">← Về game</a> · <a href="progress.html">Danh mục asset</a></p><p>Bơi: Ngọc Lam 8 khung, Đuôi Nắng 6 khung. Quay: mỗi loài 6 góc. Cùng bộ ảnh dùng trong game.</p><p><button id="turn">Thử quay đầu</button> <button id="bg">Đổi nền sáng/tối</button> <button id="pause">Tạm dừng</button></p><canvas id="preview" width="1100" height="430" aria-label="Hoạt ảnh bơi và quay đầu hai loài"></canvas><p id="status" aria-live="polite"></p></main><script src="animation.js"></script><script>
const c=document.getElementById('preview'),ctx=c.getContext('2d'),images={};for(const n of ['C01_SWIM','C02_SWIM','C01_TURN','C02_TURN']){images[n]=new Image();images[n].src='assets/'+n+'.png'}
let t=0,last=0,turn=0,dir=1,paused=false,dark=false;document.getElementById('turn').onclick=()=>turn=1;document.getElementById('bg').onclick=()=>dark=!dark;document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Tiếp tục':'Tạm dừng'};
function render(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused){t+=dt;if(turn>0){turn=Math.max(0,turn-dt/.85);if(turn===0)dir*=-1}}ctx.fillStyle=dark?'#102f3e':'#f3f5ef';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<2;i++){const name=i?'C02':'C01',frame=turn>0?Animation.turnFrame(turn):Animation.swimFrame(i?'gold':'blue',t);const im=images[name+(turn>0?'_TURN':'_SWIM')];ctx.save();ctx.translate(275+i*550,220);ctx.scale(dir,1);if(im.complete&&im.naturalWidth)ctx.drawImage(im,frame*512,0,512,320,-230,-144,460,288);ctx.restore();ctx.fillStyle=dark?'#b6dfdf':'#295751';ctx.font='18px system-ui';ctx.fillText((i?'Đuôi Nắng':'Ngọc Lam')+' · khung '+(frame+1),120+i*550,390)}document.getElementById('status').textContent=turn>0?'Đang quay đầu qua các góc nhìn':'Đang bơi · '+(dir===1?'hướng phải':'hướng trái');requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
